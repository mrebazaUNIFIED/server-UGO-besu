# Configuración para Nodo RPC de Sunwest
# Rol: API para operaciones de Sunwest (mint/burn USFCI, no valida bloques)

data-path="data"
genesis-file="../../genesis.json"
profile="ENTERPRISE"

# Configuración P2P
p2p-enabled=true
p2p-host="0.0.0.0"
p2p-port=30310
max-peers=25

# Bootnodes
bootnodes=["enode://b97dffd916edf99b5c48e4340806f7a8699ef019595bfafd442041aa5804851dd6933a63f120cf0bebcbb1239f4b57c0a203a618095836e672a6871ebe879550@127.0.0.1:30303"]

# Discovery
discovery-enabled=true

# RPC HTTP (para aplicaciones de Sunwest)
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8059
rpc-http-api=["ETH","NET","WEB3","TXPOOL","TRACE"]
rpc-http-cors-origins=["*"]
rpc-http-max-active-connections=80

# RPC WebSocket
rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-port=8060
rpc-ws-api=["ETH","NET","WEB3"]
rpc-ws-max-active-connections=80

# Logging
logging="INFO"

# Host allowlist
host-allowlist=["*"]

# Métricas
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9552

# NO minería (no es validador)
miner-enabled=false

# Sync mode
sync-mode="FULL"

# Network ID
network-id=12345



# Gas price
min-gas-price=0

# API adicionales para trazabilidad
revert-reason-enabled=true

# ----- SOPORTE PARA MIGRACIONES MASIVAS (TXPOOL) -----
tx-pool="Layered"
tx-pool-layer-max-capacity=100000
tx-pool-max-future-by-sender=50000