# Configuración para Validador 2 de FCI
# Rol: Valida bloques en consenso QBFT

data-path="data"
genesis-file="../../genesis.json"
profile="ENTERPRISE"

# Configuración P2P
p2p-enabled=true
p2p-host="0.0.0.0"
p2p-port=30305
max-peers=25

# Bootnodes
bootnodes=["enode://b97dffd916edf99b5c48e4340806f7a8699ef019595bfafd442041aa5804851dd6933a63f120cf0bebcbb1239f4b57c0a203a618095836e672a6871ebe879550@127.0.0.1:30303"]

# Discovery
discovery-enabled=true

# RPC HTTP (interno, no expuesto externamente en producción)
rpc-http-enabled=true
rpc-http-host="127.0.0.1"
rpc-http-port=8052
rpc-http-api=["ETH","NET","WEB3","ADMIN","QBFT","TXPOOL"]
rpc-http-cors-origins=["*"]

# RPC WebSocket
rpc-ws-enabled=false

# Logging
logging="INFO"

# Host allowlist
host-allowlist=["localhost","127.0.0.1"]

# Métricas
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9547

# Minería habilitada (es validador)
miner-enabled=true
miner-coinbase="0x0000000000000000000000000000000000000000"

# Sync mode
sync-mode="FULL"

# Network ID
network-id=12345

# Gas price
min-gas-price=0



# ----- SOPORTE PARA MIGRACIONES MASIVAS (TXPOOL) -----
tx-pool="Layered"
tx-pool-layer-max-capacity=100000
tx-pool-max-future-by-sender=50000